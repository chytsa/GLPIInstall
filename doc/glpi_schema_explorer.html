<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#2563eb;--pk:#fde68a;--fk:#bfdbfe;--hi:#eff6ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--bd:#334155;--ac:#60a5fa;--pk:#854d0e;--fk:#1e3a8a;--hi:#172554}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--bd:#334155;--ac:#60a5fa;--pk:#854d0e;--fk:#1e3a8a;--hi:#172554}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Segoe UI","Noto Sans TC",sans-serif}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh;height:100dvh}
aside{border-right:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;min-height:0}
aside input{margin:10px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
#list{overflow:auto;flex:1}#list div{padding:5px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px}
#list div:hover,#list div.on{background:var(--hi);color:var(--ac)}#list span{color:var(--mut);font-size:12px}
main{overflow:auto;padding:18px;min-width:0}h1{font-size:18px;margin:0 0 4px}.mut{color:var(--mut)}
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.hub{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer}.hub:hover{border-color:var(--ac)}
.hub b{display:block;word-break:break-all}
.rel{display:grid;grid-template-columns:1fr minmax(300px,1.2fr) 1fr;gap:14px;align-items:start;margin-top:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.box h3{margin:0;padding:8px 12px;font-size:13px;background:var(--hi);border-bottom:1px solid var(--bd)}
.box .sc{max-height:70vh;overflow:auto}
.it{padding:5px 12px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:12.5px;word-break:break-all}.it:hover{background:var(--hi)}.it small{color:var(--mut);display:block}
.center{border:2px solid var(--ac)}.center h3{background:var(--ac);color:#fff;font-size:14px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{padding:4px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600}.b{font-size:11px;padding:1px 6px;border-radius:9px;margin-right:3px}.PRI{background:var(--pk)}.FKb{background:var(--fk)}
.fkc{color:var(--ac);cursor:pointer}.empty{padding:12px;color:var(--mut)}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:200px 1fr}aside{border-right:0;border-bottom:1px solid var(--bd)}.rel{grid-template-columns:1fr}}
</style></head><body><div class="app">
